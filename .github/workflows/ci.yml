name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install openpyxl pyyaml pytest
      - name: Validate the crosswalk and the overlays (Annex A IDs, duplicates, empty identifiers)
        run: python scripts/validate_crosswalk.py
      - name: Consistency tests (rationale on partial matches, IAR structure, worked example figures, sources, review status)
        run: pytest -q
      - name: Regenerate every output
        run: python scripts/build_crosswalk.py
      - name: Fail if generated files are out of date with the sources
        run: git diff --exit-code -- data/crosswalk.yaml data/iso27001-overlays.csv data/by-framework
      - name: Fail if the build created files that are not committed
        run: test -z "$(git status --porcelain --untracked-files=all -- data)"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web explorer data file is generated from the sources and up to date
        run: |
          python scripts/build_web_data.py
          git diff --exit-code -- data/crosswalk.js
      - name: Syntax-check the web explorer
        run: |
          node --check assets/app.js
          node --check data/crosswalk.js
      - name: HTML is valid (html-validate, recommended preset)
        run: npx --yes html-validate@8 index.html
      - name: No external resources or inline scripts (CSP stays meaningful)
        run: |
          ! grep -Ei '<(script|link)[^>]+(src|href)="(https?:)?//' index.html
          ! grep -Ei '<script>' index.html
          ! grep -Ei '@import|url\(https?:' assets/style.css
          echo "OK: all resources are local"
