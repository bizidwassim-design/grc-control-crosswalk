name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pyyaml
      - name: Validate the CSV and regenerate every output
        run: python scripts/build_crosswalk.py
      - name: Fail if generated files are out of date with data/crosswalk.csv
        run: git diff --exit-code -- data/crosswalk.yaml data/by-framework
