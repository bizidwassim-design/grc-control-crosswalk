name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pyyaml
      - name: Validate the crosswalk and the overlays (Annex A IDs, duplicates, empty identifiers)
        run: python scripts/validate_crosswalk.py
      - name: Regenerate every output
        run: python scripts/build_crosswalk.py
      - name: Fail if generated files are out of date with the sources
        run: git diff --exit-code -- data/crosswalk.yaml data/iso27001-overlays.csv data/by-framework
      - name: Fail if the build created files that are not committed
        run: test -z "$(git status --porcelain --untracked-files=all -- data)"
