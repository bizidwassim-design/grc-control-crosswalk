crosswalk:
  version: '1.1'
  source_framework: ISO/IEC 27001:2022 Annex A
  target_frameworks:
  - NIST CSF 2.0
  - CIS Controls v8
  - ISO 42001
  - SOC 2 TSC
  overlays:
  - UAE IAR
  - DESC ISR
  - UAE PDPL
  - PCI DSS v4.0.1
  - NIST SP 800-53 Rev. 5
  - ISO 22301:2019
  license: MIT
  disclaimer: Mappings are best-effort equivalences for planning and gap analysis, not an official or audited interpretation.
  overlay_disclaimer: 'Overlays are informative expert-judgement mappings for planning and gap analysis. They are not legal
    advice, not an official mapping by any regulator or standards body, and not a substitute for the current official texts.
    Laws and regulations change: check current status (for the UAE PDPL, the Executive Regulations; DIFC and ADGM have their
    own data protection regimes) before relying on them.'
  verification_levels:
    verified: Identifier and title checked against the publisher's own public text.
    secondary: Checked against a published translation or reputable secondary sources; the official text could not be retrieved.
    unverified: Taken from secondary descriptions only; the publisher's text is not publicly available.
